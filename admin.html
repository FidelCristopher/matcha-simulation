<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matcha Tcih | Kitchen Display System & Order Monitor</title>
    <meta name="description" content="Real-time order monitoring dashboard for Matcha Tcih kitchen, barista, and staff.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Inter:wght@400;500;600;700&family=Galada&display=swap" rel="stylesheet">

    <!-- Admin Stylesheet -->
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <!-- Admin Header -->
    <header class="admin-header">
        <div class="admin-brand">
            <div class="admin-logo">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                    <path d="M12 7V17M7 12C7 9.5 9.5 7 12 7C14.5 7 17 9.5 17 12C17 14.5 14.5 17 12 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
                <span>Matcha Tcih</span>
            </div>
            <div class="admin-live-badge">
                <span class="pulse-dot"></span>
                <span>Live Kitchen Monitor</span>
            </div>
        </div>

        <div class="admin-actions">
            <div class="admin-clock" id="admin-clock">00:00:00</div>
            <button class="admin-btn" id="sample-order-btn" title="Simulasikan pesanan masuk baru">+ Test Order</button>
            <button class="admin-btn" id="clear-orders-btn" title="Hapus riwayat pesanan">🗑 Clear</button>
            <a href="index.html" class="admin-btn admin-btn-primary" title="Buka Halaman Customer Kiosk">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
                <span>Open Kiosk</span>
            </a>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="admin-main">

        <!-- KPI Statistic Analytics -->
        <section class="admin-stats-grid">
            <div class="stat-card">
                <span class="stat-label">Total Revenue</span>
                <span class="stat-value revenue" id="stat-revenue">$0.00</span>
                <span class="stat-subtext">Dari pesanan yang berhasil dicheckout</span>
            </div>

            <div class="stat-card">
                <span class="stat-label">Sedang Diseduh (Active)</span>
                <span class="stat-value active" id="stat-active">0</span>
                <span class="stat-subtext">Menunggu proses barista</span>
            </div>

            <div class="stat-card">
                <span class="stat-label">Pesanan Selesai</span>
                <span class="stat-value" id="stat-completed">0</span>
                <span class="stat-subtext">Sudah disajikan ke pelanggan</span>
            </div>

            <div class="stat-card">
                <span class="stat-label">Total Tiket Masuk</span>
                <span class="stat-value" id="stat-total">0</span>
                <span class="stat-subtext">Akumulasi sesi hari ini</span>
            </div>
        </section>

        <!-- Controls, Filter Tabs & Search -->
        <section class="admin-filter-bar">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">Semua Pesanan</button>
                <button class="filter-tab" data-filter="brewing">⏳ Sedang Diseduh</button>
                <button class="filter-tab" data-filter="completed">✔ Selesai</button>
            </div>

            <div class="search-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-orders" placeholder="Cari ID atau nama menu...">
            </div>
        </section>

        <!-- Orders Kitchen Display Cards Grid -->
        <section class="orders-grid" id="orders-grid">
            <!-- Dynamic order cards generated by js/admin.js -->
        </section>

    </main>

    <!-- Admin Engine Script -->
    <script type="module" src="js/admin.js"></script>
</body>
</html>
