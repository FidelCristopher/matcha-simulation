<!DOCTYPE html>
<html>
<head>
  <style>
    iframe { width: 1440px; height: 900px; border: none; }
  </style>
</head>
<body style='margin:0; padding:0; overflow:hidden;'>
  <iframe id='frame' src='index.html'></iframe>
  <script>
    const frame = document.getElementById('frame');
    frame.onload = () => {
      const doc = frame.contentDocument;
      setTimeout(() => {
        const cup = doc.querySelector('.thumb-cup-card.cup-left');
        if (cup) {
          // Trigger mouseover
          cup.dispatchEvent(new MouseEvent('mouseenter', { bubbles: true }));
          cup.dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
          // Add a hover class to verify styles
          const img = cup.querySelector('.thumb-cup-img');
          if (img) {
            img.style.transform = 'translate3d(0, -8px, 0) scale(1.05)';
            img.style.filter = 'drop-shadow(0 22px 34px rgba(16, 55, 19, 0.22))';
          }
          const tag = cup.querySelector('.thumb-cup-tag');
          if (tag) {
            tag.style.transform = 'translate3d(0, -6px, 0) scale(1.08)';
            tag.style.boxShadow = '0 16px 36px rgba(16, 55, 19, 0.42), 0 0 20px rgba(98, 139, 53, 0.55)';
          }
        }
      }, 500);
    };
  </script>
</body>
</html>
